<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Jaathakam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Malayalam:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="font.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            text-align: center;
            background-color: #ffffff;
            color: #1a1a1a;
            overflow-x: hidden;
            position: relative;
        }

        .main-title {
            font-family: 'OpenBoek', fantasy, sans-serif !important;
            font-size: clamp(2rem, 3.8vw, 3.5rem);
            margin: 0 0 0.5rem 0;
            letter-spacing: 2px;
            font-weight: normal;
        }

        p {
            font-size: 1.15rem;
            color: #4a5568;
            margin-bottom: 1.5rem;
        }

        #input-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            width: 96%;
            max-width: 1050px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1.2vw, 14px);
            width: 100%;
        }

        .dancing-cat {
            flex-shrink: 0;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.12));
            transition: all 0.25s ease;
        }

        .dancing-cat-left {
            height: min(195px, max(80px, 20vh), 16vw);
            width: auto;
            margin-right: clamp(8px, 1.8vw, 24px);
        }

        .dancing-cat-right {
            height: min(170px, max(70px, 18vh), 14vw);
            width: min(170px, max(70px, 18vh), 14vw);
            object-fit: contain;
            margin-left: clamp(8px, 1.8vw, 24px);
        }

        /* Creative Segmented Language Toggle */
        .lang-toggle {
            display: inline-flex;
            background: #f1f5f9;
            padding: 3px;
            border-radius: 999px;
            gap: 4px;
            border: 1px solid #e2e8f0;
            margin-bottom: 0.35rem;
        }

        .lang-pill {
            border: none;
            background: transparent;
            padding: 6px 18px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Noto Sans Malayalam', 'Inter', sans-serif;
        }

        .lang-pill:hover {
            color: #0f172a;
        }

        .lang-pill.active {
            background: #ffffff;
            color: #0f172a;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Minimalist Modern Input */
        .minimal-input {
            flex: 1;
            min-width: 140px;
            height: 52px;
            padding: 0 1.25rem;
            font-size: 1.05rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            background: #fafafa;
            color: #0f172a;
            text-align: left;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .minimal-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .minimal-input:focus {
            background: #ffffff;
            border-color: #0f172a;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
            transform: translateY(-1px);
        }

        /* From Uiverse.io by Creatlydev - Circular Rotating Text Button */
        .button {
            cursor: pointer;
            border: none;
            background: #7808d0;
            color: #fff;
            width: 60px;
            height: 60px;
            min-width: 60px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            display: grid;
            place-content: center;
            transition: background 300ms, transform 200ms;
            font-weight: 600;
            margin: 0;
            flex-shrink: 0;
        }

        .button__text {
            position: absolute;
            inset: 0;
            animation: text-rotation 8s linear infinite;
            margin: 0;
        }

        .button__text > span {
            position: absolute;
            transform: rotate(calc(19deg * var(--index)));
            inset: 4px;
            font-size: 0.48rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .button__circle {
            position: relative;
            width: 25px;
            height: 25px;
            overflow: hidden;
            background: #fff;
            color: #7808d0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button__circle svg {
            width: 10px;
            height: 10px;
        }

        .button__icon--copy {
            position: absolute;
            transform: translate(-150%, 150%);
        }

        .button:hover {
            background: #000;
            transform: scale(1.05);
        }

        .button:hover .button__icon {
            color: #000;
        }

        .button:hover .button__icon:first-child {
            transition: transform 0.3s ease-in-out;
            transform: translate(150%, -150%);
        }

        .button:hover .button__icon--copy {
            transition: transform 0.3s ease-in-out 0.1s;
            transform: translate(0);
        }

        @keyframes text-rotation {
            to {
                rotate: 360deg;
            }
        }

        #reset-btn,
        #play-audio-btn {
            padding: 0.7rem 1.6rem;
            border-radius: 10px;
            border: 2px solid #8b6914;
            background: linear-gradient(135deg, #f5e6c8 0%, #e8d5a3 50%, #d4b978 100%);
            color: #5c3d0e;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 10px rgba(139, 105, 20, 0.2);
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.3);
        }

        #reset-btn:hover,
        #play-audio-btn:hover {
            background: linear-gradient(135deg, #d4b978 0%, #c9a85c 50%, #b8963e 100%);
            border-color: #6b4f10;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(139, 105, 20, 0.35);
        }

        #play-audio-btn {
            background: linear-gradient(135deg, #5c3d0e 0%, #7a5518 50%, #8b6914 100%);
            color: #f5e6c8;
            border-color: #a07d2e;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        #play-audio-btn:hover {
            background: linear-gradient(135deg, #7a5518 0%, #8b6914 50%, #a07d2e 100%);
            border-color: #c9a85c;
        }

        #revealed-text {
            max-width: 650px;
            margin: 1.5rem auto;
            font-size: 1.25rem;
            line-height: 1.8;
            color: #1e293b;
            font-family: 'Noto Sans Malayalam', 'Inter', sans-serif;
        }

        .center-banner-gif {
            max-width: min(400px, 78vw, 24vh);
            width: 100%;
            height: auto;
            margin: 0.25rem auto 1rem auto;
            border-radius: 8px;
            display: block;
        }

        .mullapoo-top-left {
            position: fixed;
            top: 0;
            left: 0;
            width: clamp(100px, 15vw, 230px);
            height: auto;
            pointer-events: none;
            z-index: 2;
            user-select: none;
        }

        .deepam-bottom-left {
            position: fixed;
            bottom: 0;
            left: 0;
            width: clamp(90px, 13.5vw, 210px);
            height: auto;
            pointer-events: none;
            z-index: 2;
            user-select: none;
        }

        .astrologer-img {
            max-width: clamp(480px, 55vw, 750px);
            width: 100%;
            height: auto;
            margin: -1.25rem auto 0 auto;
            display: block;
            align-self: center;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.1));
        }

        .bells-bottom-right {
            position: fixed;
            bottom: clamp(18px, 3vh, 34px);
            right: 0;
            width: clamp(100px, 15.5vw, 235px);
            height: auto;
            pointer-events: none;
            z-index: 2;
            user-select: none;
        }

        .statue-top-right {
            position: fixed;
            top: 0;
            right: 0;
            width: clamp(80px, 11vw, 170px);
            height: auto;
            pointer-events: none;
            z-index: 2;
            user-select: none;
        }

        /* Fluid Scaling for 13" MacBook, Tablets, and Small Displays */
        @media (max-width: 1024px) {
            #input-section { width: 98%; }
            .dancing-cat-left { height: min(120px, 14vw); margin-right: 16px; }
            .dancing-cat-right { height: min(100px, 12vw); width: min(100px, 12vw); margin-left: 16px; }
        }

        @media (max-width: 768px) {
            .deepam-bottom-left { opacity: 0.45; }
            .bells-bottom-right { opacity: 0.45; }
            .dancing-cat-left { height: 75px; margin-right: 10px; }
            .dancing-cat-right { height: 65px; width: 65px; margin-left: 10px; }
        }

        @media (max-width: 560px) {
            /* On mobile phones, hide the outer dancing cats so the input & rotating button remain spacious */
            .dancing-cat-left { display: none; }
            .dancing-cat-right { display: none; }
            .input-row { gap: 8px; }
            .mullapoo-top-left { width: 90px; }
            .statue-top-right { width: 75px; }
            .deepam-bottom-left { width: 75px; opacity: 0.35; }
            .bells-bottom-right { width: 70px; opacity: 0.35; }
        }

        /* Compact vertical height adjustment (e.g. 13" MacBooks with browser toolbars) */
        @media (max-height: 780px) {
            body { padding: 0.5rem 1rem; }
            .main-title { font-size: 2.5rem; margin-bottom: 0.25rem; }
            .center-banner-gif { max-width: 280px; margin-bottom: 0.5rem; }
            .astrologer-img { max-width: min(520px, 50vw); margin-top: -1rem; }
            .dancing-cat-left { height: 135px; }
            .dancing-cat-right { height: 115px; width: 115px; }
            .deepam-bottom-left { width: 130px; }
            .bells-bottom-right { width: 140px; }
        }

        @media (max-height: 650px) {
            .main-title { font-size: 2.1rem; }
            .center-banner-gif { max-width: 220px; margin-bottom: 0.35rem; }
            .astrologer-img { max-width: min(420px, 44vw); margin-top: -1.2rem; }
            .dancing-cat-left { height: 100px; }
            .dancing-cat-right { height: 85px; width: 85px; }
        }

        #loading-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #result-section {
            position: relative;
            max-width: 800px;
            width: 90%;
            margin: 2rem auto;
            padding: 3rem 4rem;
            background-color: #fdf5e6;
            background-image: url('old-paper.png');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            box-shadow: inset 0 0 60px rgba(139, 69, 19, 0.15), 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(139, 69, 19, 0.25);
            color: #3b2f2f;
            z-index: 10;
        }

        #result-section h2 {
            font-family: 'OpenBoek', fantasy, sans-serif;
            color: #5c4033;
            font-size: 2.5rem;
            margin-top: 0;
            text-align: center;
            letter-spacing: 1px;
        }

        #revealed-text {
            font-size: 1.35rem;
            line-height: 1.8;
            font-weight: 500;
            text-align: justify;
            font-family: 'Noto Sans Malayalam', 'Inter', sans-serif;
            text-shadow: 0px 0px 1px rgba(0,0,0,0.1);
            min-height: 150px;
        }

        @media (max-width: 768px) {
            #result-section { padding: 2rem 1.5rem; }
            #revealed-text { font-size: 1.15rem; }
        }
    </style>
</head>

<body>

    <img src="mullapo.png" alt="Mullapoo" class="mullapoo-top-left">
    <img src="deepam.png" alt="Deepam" class="deepam-bottom-left">
    <img src="bells.png" alt="Bells" class="bells-bottom-right">
    <img src="statue.png" alt="Statue" class="statue-top-right">

    <h1 class="main-title">GITHUB JATHAKAM</h1>

    <img src="banner.gif" alt="Jaathakam Animation" class="center-banner-gif">

    <div id="input-section">
        <!-- Creative Segmented Language Switch (Malayalam by default) -->
        <div class="lang-toggle" role="tablist">
            <button type="button" class="lang-pill active" data-lang="ml">മലയാളം</button>
            <button type="button" class="lang-pill" data-lang="en">English</button>
        </div>
        <input type="hidden" id="language-select" value="ml">

        <div class="input-row">
            <img src="dancing-cat-left.gif" onerror="this.src='https://media.giphy.com/media/3UkqVq3F50bVCi9URl/giphy.gif'" alt="Dancing Cat" class="dancing-cat dancing-cat-left">

            <input type="text" id="github-username" class="minimal-input" placeholder="GitHub username..."
                autocomplete="off" spellcheck="false">

            <button id="submit-btn" class="button" type="button">
                <p class="button__text">
                    <span style="--index: 0;">•</span>
                    <span style="--index: 1;"> </span>
                    <span style="--index: 2;">E</span>
                    <span style="--index: 3;">N</span>
                    <span style="--index: 4;">N</span>
                    <span style="--index: 5;">E</span>
                    <span style="--index: 6;"> </span>
                    <span style="--index: 7;">•</span>
                    <span style="--index: 8;"> </span>
                    <span style="--index: 9;">N</span>
                    <span style="--index: 10;">J</span>
                    <span style="--index: 11;">E</span>
                    <span style="--index: 12;">K</span>
                    <span style="--index: 13;">K</span>
                    <span style="--index: 14;">U</span>
                    <span style="--index: 15;"> </span>
                    <span style="--index: 16;">•</span>
                    <span style="--index: 17;"> </span>
                </p>

                <div class="button__circle">
                    <svg viewBox="0 0 14 15" fill="none" xmlns="http://www.w3.org/2000/svg" class="button__icon" width="14">
                        <path d="M13.376 11.552l-.264-10.44-10.44-.24.024 2.28 6.96-.048L.2 12.56l1.488 1.488 9.432-9.432-.048 6.912 2.304.024z" fill="currentColor"></path>
                    </svg>
                    <svg viewBox="0 0 14 15" fill="none" width="14" xmlns="http://www.w3.org/2000/svg" class="button__icon button__icon--copy">
                        <path d="M13.376 11.552l-.264-10.44-10.44-.24.024 2.28 6.96-.048L.2 12.56l1.488 1.488 9.432-9.432-.048 6.912 2.304.024z" fill="currentColor"></path>
                    </svg>
                </div>
            </button>

            <img src="dancing-cat-right.gif" onerror="this.src='https://media.giphy.com/media/VSLIjK1WyV3GbT5m9G/giphy.gif'" alt="Dancing Cat" class="dancing-cat dancing-cat-right">
        </div>

        <div id="error-message" style="color: #ef4444; font-size: 0.95rem; display: none; margin-top: 6px; text-align: center; width: 100%;"></div>

        <img src="astrologer.png" alt="Astrologer" class="astrologer-img">
    </div>

    <div id="loading-section" style="display: none;">
        <img src="astrologer-loading.gif" alt="Consulting the stars" style="max-width: clamp(520px, 70vw, 750px); width: 100%; height: auto; border-radius: 16px; margin: 0.5rem auto 1.25rem auto; display: block; box-shadow: 0 8px 28px rgba(0,0,0,0.18);">
        <p style="font-size: 1.35rem; font-weight: 600; color: #334155; text-align: center;">നക്ഷത്രങ്ങൾ നോക്കുന്നു... Consulting the stars...</p>
    </div>

    <div id="result-section" style="display: none;">
        <h2>Your Jaathakam</h2>
        <div id="revealed-text"></div>
        <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
            <div id="audio-container" style="display: none;">
                <button id="play-audio-btn">Hear it out loud</button>
            </div>
            <button id="reset-btn">Try another</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
