<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Jaathakam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Malayalam:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="font.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem 1rem;
            text-align: center;
            background-color: #ffffff;
            color: #1a1a1a;
            overflow-x: hidden;
            position: relative;
        }

        .main-title {
            font-family: 'OpenBoek', fantasy, sans-serif !important;
            font-size: 3.5rem;
            margin: 0 0 1rem 0;
            letter-spacing: 2px;
            font-weight: normal;
        }

        p {
            font-size: 1.15rem;
            color: #4a5568;
            margin-bottom: 1.5rem;
        }

        #input-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .dancing-cat {
            flex-shrink: 0;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.08));
        }

        .dancing-cat-left {
            height: 102px;
            width: auto;
        }

        .dancing-cat-right {
            height: 86px;
            width: 86px;
            object-fit: contain;
        }

        .cat-flank {
            width: 54px;
            height: auto;
            flex-shrink: 0;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.08));
            transition: transform 0.3s ease;
        }

        .cat-right {
            transform: scaleX(-1);
        }

        /* Creative Segmented Language Toggle */
        .lang-toggle {
            display: inline-flex;
            background: #f1f5f9;
            padding: 3px;
            border-radius: 999px;
            gap: 4px;
            border: 1px solid #e2e8f0;
            margin-bottom: 0.35rem;
        }

        .lang-pill {
            border: none;
            background: transparent;
            padding: 6px 18px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Noto Sans Malayalam', 'Inter', sans-serif;
        }

        .lang-pill:hover {
            color: #0f172a;
        }

        .lang-pill.active {
            background: #ffffff;
            color: #0f172a;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Minimalist Modern Input */
        .minimal-input {
            flex: 1;
            height: 52px;
            padding: 0 1.25rem;
            font-size: 1.05rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            background: #fafafa;
            color: #0f172a;
            text-align: left;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .minimal-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .minimal-input:focus {
            background: #ffffff;
            border-color: #0f172a;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
            transform: translateY(-1px);
        }

        /* From Uiverse.io by Creatlydev - Circular Rotating Text Button */
        .button {
            cursor: pointer;
            border: none;
            background: #7808d0;
            color: #fff;
            width: 60px;
            height: 60px;
            min-width: 60px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            display: grid;
            place-content: center;
            transition: background 300ms, transform 200ms;
            font-weight: 600;
            margin: 0;
            flex-shrink: 0;
        }

        .button__text {
            position: absolute;
            inset: 0;
            animation: text-rotation 8s linear infinite;
            margin: 0;
        }

        .button__text > span {
            position: absolute;
            transform: rotate(calc(19deg * var(--index)));
            inset: 4px;
            font-size: 0.48rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .button__circle {
            position: relative;
            width: 25px;
            height: 25px;
            overflow: hidden;
            background: #fff;
            color: #7808d0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button__circle svg {
            width: 10px;
            height: 10px;
        }

        .button__icon--copy {
            position: absolute;
            transform: translate(-150%, 150%);
        }

        .button:hover {
            background: #000;
            transform: scale(1.05);
        }

        .button:hover .button__icon {
            color: #000;
        }

        .button:hover .button__icon:first-child {
            transition: transform 0.3s ease-in-out;
            transform: translate(150%, -150%);
        }

        .button:hover .button__icon--copy {
            transition: transform 0.3s ease-in-out 0.1s;
            transform: translate(0);
        }

        @keyframes text-rotation {
            to {
                rotate: 360deg;
            }
        }

        #reset-btn,
        #play-audio-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #1e293b;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #reset-btn:hover,
        #play-audio-btn:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        #revealed-text {
            max-width: 650px;
            margin: 1.5rem auto;
            font-size: 1.25rem;
            line-height: 1.8;
            color: #1e293b;
            font-family: 'Noto Sans Malayalam', 'Inter', sans-serif;
        }

        .center-banner-gif {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin: 0.5rem auto 1.5rem auto;
            border-radius: 8px;
            display: block;
        }

        .mullapoo-top-left {
            position: fixed;
            top: 0;
            left: 0;
            width: 230px;
            height: auto;
            pointer-events: none;
            z-index: 2;
            user-select: none;
        }

        .deepam-bottom-left {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 210px;
            height: auto;
            pointer-events: none;
            z-index: 2;
            user-select: none;
        }

        .astrologer-img {
            max-width: 260px;
            width: 100%;
            height: auto;
            margin-top: 0.85rem;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        .bells-bottom-right {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 180px;
            height: auto;
            pointer-events: none;
            z-index: 2;
            user-select: none;
        }

        .statue-top-right {
            position: fixed;
            top: 0;
            right: 0;
            width: 170px;
            height: auto;
            pointer-events: none;
            z-index: 2;
            user-select: none;
        }

        /* Prevent corner images from coinciding with the center input / cats */
        @media (max-width: 1100px) {
            .mullapoo-top-left { width: 170px; }
            .deepam-bottom-left { width: 150px; }
            .bells-bottom-right { width: 140px; }
            .statue-top-right { width: 130px; }
            .dancing-cat-left { height: 86px; }
            .dancing-cat-right { height: 72px; width: 72px; }
        }

        @media (max-width: 820px) {
            .mullapoo-top-left { width: 120px; }
            .deepam-bottom-left { width: 100px; opacity: 0.5; }
            .bells-bottom-right { width: 90px; opacity: 0.5; }
            .statue-top-right { width: 95px; }
            .cat-flank { width: 44px; }
            .dancing-cat-left { height: 68px; }
            .dancing-cat-right { height: 56px; width: 56px; }
        }

        @media (max-width: 640px) {
            .dancing-cat-left { display: none; }
            .dancing-cat-right { display: none; }
        }

        @media (max-height: 750px) {
            .center-banner-gif { max-width: 320px; margin-bottom: 0.75rem; }
            .main-title { font-size: 2.8rem; margin-bottom: 0.5rem; }
            .astrologer-img { max-width: 200px; }
            .deepam-bottom-left { width: 140px; }
            .bells-bottom-right { width: 120px; }
        }
    </style>
</head>

<body>

    <img src="mullapo.png" alt="Mullapoo" class="mullapoo-top-left">
    <img src="deepam.png" alt="Deepam" class="deepam-bottom-left">
    <img src="bells.png" alt="Bells" class="bells-bottom-right">
    <img src="statue.png" alt="Statue" class="statue-top-right">

    <h1 class="main-title">GITHUB JATHAKAM</h1>

    <img src="Screen Recording 2026-09-12 125051.gif" alt="Jaathakam Animation" class="center-banner-gif">

    <div id="input-section">
        <!-- Creative Segmented Language Switch (Malayalam by default) -->
        <div class="lang-toggle" role="tablist">
            <button type="button" class="lang-pill active" data-lang="ml">മലയാളം</button>
            <button type="button" class="lang-pill" data-lang="en">English</button>
        </div>
        <input type="hidden" id="language-select" value="ml">

        <div class="input-row">
            <img src="dancing-cat-left.gif" onerror="this.src='https://media.giphy.com/media/3UkqVq3F50bVCi9URl/giphy.gif'" alt="Dancing Cat" class="dancing-cat dancing-cat-left">

            <img src="githubcat.png" alt="GitHub Cat" class="cat-flank cat-left">

            <input type="text" id="github-username" class="minimal-input" placeholder="GitHub username..."
                autocomplete="off" spellcheck="false">

            <button id="submit-btn" class="button" type="button">
                <p class="button__text">
                    <span style="--index: 0;">•</span>
                    <span style="--index: 1;"> </span>
                    <span style="--index: 2;">E</span>
                    <span style="--index: 3;">N</span>
                    <span style="--index: 4;">N</span>
                    <span style="--index: 5;">E</span>
                    <span style="--index: 6;"> </span>
                    <span style="--index: 7;">•</span>
                    <span style="--index: 8;"> </span>
                    <span style="--index: 9;">N</span>
                    <span style="--index: 10;">J</span>
                    <span style="--index: 11;">E</span>
                    <span style="--index: 12;">K</span>
                    <span style="--index: 13;">K</span>
                    <span style="--index: 14;">U</span>
                    <span style="--index: 15;"> </span>
                    <span style="--index: 16;">•</span>
                    <span style="--index: 17;"> </span>
                </p>

                <div class="button__circle">
                    <svg viewBox="0 0 14 15" fill="none" xmlns="http://www.w3.org/2000/svg" class="button__icon" width="14">
                        <path d="M13.376 11.552l-.264-10.44-10.44-.24.024 2.28 6.96-.048L.2 12.56l1.488 1.488 9.432-9.432-.048 6.912 2.304.024z" fill="currentColor"></path>
                    </svg>
                    <svg viewBox="0 0 14 15" fill="none" width="14" xmlns="http://www.w3.org/2000/svg" class="button__icon button__icon--copy">
                        <path d="M13.376 11.552l-.264-10.44-10.44-.24.024 2.28 6.96-.048L.2 12.56l1.488 1.488 9.432-9.432-.048 6.912 2.304.024z" fill="currentColor"></path>
                    </svg>
                </div>
            </button>

            <img src="githubcat.png" alt="GitHub Cat" class="cat-flank cat-right">

            <img src="dancing-cat-right.gif" onerror="this.src='https://media.giphy.com/media/VSLIjK1WyV3GbT5m9G/giphy.gif'" alt="Dancing Cat" class="dancing-cat dancing-cat-right">
        </div>

        <div id="error-message" style="color: #ef4444; font-size: 0.9rem; display: none; margin-top: 6px;"></div>

        <img src="astrologer.png" alt="Astrologer" class="astrologer-img">
    </div>

    <div id="loading-section" style="display: none;">
        <img src="astrologer gif.gif" alt="Consulting the stars" style="max-width: 260px; width: 100%; height: auto; border-radius: 12px; margin: 0.5rem auto 1rem auto; display: block; box-shadow: 0 4px 14px rgba(0,0,0,0.1);">
        <p style="font-size: 1.1rem; font-weight: 500; color: #475569;">നക്ഷത്രങ്ങൾ നോക്കുന്നു... Consulting the stars...</p>
    </div>

    <div id="result-section" style="display: none;">
        <h2>Your Jaathakam</h2>
        <div id="revealed-text"></div>
        <div id="audio-container" style="display: none;">
            <button id="play-audio-btn">Listen (Bulbul TTS)</button>
        </div>
        <br>
        <button id="reset-btn">Try Another</button>
    </div>

    <script src="app.js"></script>
</body>

</html>
